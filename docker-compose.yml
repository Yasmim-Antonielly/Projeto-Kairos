version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-kairos
    environment:
      # Senha do usuário SYSTEM/SYS
      - ORACLE_PASSWORD=k123
      - APP_USER=kairos
      - APP_USER_PASSWORD=k123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  oracle_data:
